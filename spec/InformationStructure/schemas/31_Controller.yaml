control-construct:
  type: array
  x-key: element-name
  items:
    oneOf:
      - description: 'controller'
        type: object
        required:
          - element-name
          - category
          - _template
          - _logical-controller
          - logical-termination-point
        properties:
          element-name:
            type: string
            description: >
              'controllerName
              candidate: from [CDM://v1/regard-controller$request.body#controller-name]
              running: from candidate
              operational:
                managementIp = [./logical-termination-point=controller-manager/layer-protocol=tcp-server/local-ip-address]
                managementPort = [./logical-termination-point=controller-manager/layer-protocol=tcp-server/local-port]
                measurementFunction = [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name]
                from running; entire CC to be deleted, if [[managementIp]:[managementPort][measurementFunction]$response.code]!=200'
          category:
            type: string
            enum:
              - 'controller'
          _template:
            type: string
            description: >
              'controllerTemplateName
              Reference towards an entry in the list of Profiles
              Both instances of ControlConstruct and Profile must have an identical value in their category attributes
              candidate: from [CDM://v1/regard-controller$request.body#template]
              running: from candidate
              operational: from running'
          _logical-controller:
            type: string
            description: >
              'managementDomain
              Reference towards an entry in the list of CC with category==logicalController
              candidate: from [CDM://v1/establish-controller-in-management-domain$request.body#controller-name]
              running: from candidate
              operational: from running'
          logical-termination-point:
            type: array
            x-key: local-id
            items:
              oneOf:
                - description: 'controllerManager'
                  type: object
                  required:
                    - local-id
                    - layer-protocol
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'controller-manager'
                    layer-protocol:
                      type: array
                      x-key: local-id
                      items:
                        oneOf:
                          - description: 'httpServer'
                            type: object
                            required:
                              - local-id
                              - http-user-name
                              - http-password
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'http-server'
                                description: 'entire LP to be deleted by [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name], if [http-user-name] not included in proprietary response of the Element'
                              http-user-name:
                                type: string
                                description: >
                                  'Name of the admin user at the Controller
                                  candidate: from [CDM://v1/regard-controller$request.body#admin-user-name]
                                  running: from candidate
                                  operational: from running'
                              http-password:
                                type: string
                                description: >
                                  'Password of the user for administrating the Controller
                                  candidate: from [CDM://v1/regard-controller$request.body#admin-password]
                                  running: from candidate
                                  operational: from running'
                          - description: 'managementDomainInterface'
                            type: object
                            required:
                              - local-id
                              - http-user-name
                              - http-password
                            properties:
                              local-id:
                                type: string
                                description: >
                                  'applicationName
                                  candidate: ./. (target state to be found at LogicalController)
                                  running: ./. (target state to be found at LogicalController)
                                  operational: created by [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name]'
                              http-user-name:
                                type: string
                                description: >
                                  'applicationName used as name of the user applied by the application to authenticate at the Controller
                                  candidate: ./. (target state to be found at LogicalController)
                                  running: ./. (target state to be found at LogicalController)
                                  operational: set by [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name]'
                              http-password:
                                type: string
                                description: >
                                  'Password of the user applied by the application to authenticate at the Controller
                                  candidate: ./. (target state to be found at LogicalController)
                                  running: ./. (target state to be found at LogicalController)
                                  operational: empty string, because cannot be read from the Element'
                              http-methods:
                                type: array
                                description: >
                                  'List of HTTP methods allowed to be requested by the Application on the ManagementDomain
                                  candidate: ./. (target state to be found at LogicalController)
                                  running: ./. (target state to be found at LogicalController)
                                  operational: set by [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name]'
                                items:
                                  type: string
                                  enum:
                                  - 'post'
                                  - 'get'
                                  - 'patch'
                                  - 'put'
                                  - 'delete'
                          - description: 'tcpServer'
                            type: object
                            required:
                              - local-id
                              - local-ip-address
                              - local-port
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'tcp-server'
                              local-ip-address:
                                type: string
                                description: >
                                  'managementIp, IP address of the Controller
                                  candidate: from [CDM://v1/regard-controller$request.body#local-ip-address]
                                  running: from candidate
                                  operational: set by [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name]'
                              local-port:
                                type: integer
                                description: >
                                  'managementPort, TCP port of the Controller
                                  candidate: from [CDM://v1/regard-controller$request.body#local-port]
                                  running: from candidate
                                  operational: set by [/network-control-domain=running/profile=[controllerTemplateName]/measure-controller-function-name]'
                - description: 'LogicalTerminationPoint - see 36_MountPoint.yaml'
                  type: object
